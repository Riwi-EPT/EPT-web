name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read # install @jteban1/shared from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # read:packages for @jteban1/shared. GITHUB_TOKEN works if the package grants
      # this repo read access; otherwise add a NODE_AUTH_TOKEN secret (PAT).
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The committed lockfile is generated on Windows; npm (ci OR install) then
      # skips the Linux-only native optional deps (rollup/esbuild) it needs on the
      # runner — npm bug npm/cli#4828. Removing the lockfile first makes npm resolve
      # this platform's binaries fresh (the remedy npm itself recommends).
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present
