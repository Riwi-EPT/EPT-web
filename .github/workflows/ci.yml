name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read # install @jteban1/shared from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # read:packages for @jteban1/shared. GITHUB_TOKEN works if the package grants
      # this repo read access; otherwise add a NODE_AUTH_TOKEN secret (PAT).
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install` (not `npm ci`): a Windows-generated lockfile makes `npm ci`
      # skip Linux-only native optional deps (rollup/esbuild) — npm bug
      # npm/cli#4828 — which breaks the Vite build on the Linux runner. install
      # re-resolves the current platform's binaries.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present
