# Static SPA host for EPT-web (issue #15 / D2).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (JS/CSS/JSON/SVG) — the JS bundle compresses ~3-4x.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Long-cache the fingerprinted assets Vite emits under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a redeploy serves a stale shell that
    # points at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback: unknown paths serve index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
