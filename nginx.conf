# Static SPA host for EPT-web (issue #15 / D2).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted assets Vite emits under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths serve index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
